<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falcon Chemicals</title>
<link rel="canonical" href="https://falconchemicals.ae" />
<meta name="robots" content="noindex">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo {
    width: 220px;
    max-width: 55vw;
    opacity: 0;
    animation: fadeIn 0.5s ease-out forwards, pulse 1.1s ease-in-out 0.5s infinite;
  }

  .logo.ready {
    animation: none;
    transform: scale(1.08);
    opacity: 1;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* Progress bar */
  .progress-track {
    position: fixed;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    width: 240px;
    max-width: 60vw;
    height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: #ED1C24;
    border-radius: 4px;
  }

  /* Camera flash overlay */
  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  .flash.fire {
    animation: flashPulse 0.3s ease-out forwards;
  }

  @keyframes flashPulse {
    0%   { opacity: 0; }
    35%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="stage">
    <img class="logo" id="logo" src="logo.jpg" alt="Falcon Chemicals">
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="bar"></div>
  </div>

  <div class="flash" id="flash"></div>

  <script>
    var DESTINATION   = 'https://falconchemicals.ae';
    var MIN_DISPLAY   = 600;   // ms — avoids an awkward instant blink if load is very fast
    var MAX_WAIT      = 4000;  // ms — safety fallback if preload can't be detected
    var FLASH_DURATION = 300;  // ms

    var startTime = Date.now();
    var finished  = false;

    var bar = document.getElementById('bar');
    var logo = document.getElementById('logo');

    // Simulated progress creep toward 90% while we wait for the real signal
    var progress = 0;
    var progressTimer = setInterval(function () {
      if (progress < 90) {
        progress += (90 - progress) * 0.06;
        bar.style.width = progress + '%';
      }
    }, 100);

    function finish() {
      if (finished) return;
      finished = true;
      clearInterval(progressTimer);

      var elapsed = Date.now() - startTime;
      var wait = Math.max(0, MIN_DISPLAY - elapsed);

      setTimeout(function () {
        // Complete the bar and finish the logo zoom
        bar.style.transition = 'width 0.25s ease-out';
        bar.style.width = '100%';
        logo.classList.add('ready');

        setTimeout(function () {
          document.getElementById('flash').classList.add('fire');
          setTimeout(function () {
            window.location.href = DESTINATION;
          }, FLASH_DURATION);
        }, 200);

      }, wait);
    }

    // Attempt to preload the destination in the background.
    // Note: this can be blocked by the destination site's security headers
    // (X-Frame-Options / CSP) — if so, the safety timeout below takes over.
    try {
      var preload = document.createElement('iframe');
      preload.style.display = 'none';
      preload.setAttribute('aria-hidden', 'true');
      preload.onload = finish;
      preload.src = DESTINATION;
      document.body.appendChild(preload);
    } catch (e) {
      // If iframe creation fails for any reason, fall back to timeout only.
    }

    // Safety fallback — guarantees the page never hangs indefinitely
    setTimeout(finish, MAX_WAIT);
  </script>

</body>
</html>
